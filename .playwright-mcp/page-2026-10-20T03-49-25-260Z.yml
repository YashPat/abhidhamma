      - heading "Feeling and rapture" [level=1] [ref=f20e17]
      - paragraph [ref=f20e18]: A pleasant thrill feels like one thing. The sheets split it.
      - paragraph [ref=f20e19]: Some of this set can be present while others are missing.
      - generic [ref=f20e20]:
        - heading "Can they share a moment?" [level=2] [ref=f20e21]
        - paragraph [ref=f20e22]: Rapture requires joyful feeling and is not guaranteed by it. It drops out of every citta whose feeling is not joyful, out of both hatred-rooted cittas, and out of body-consciousness. It also drops out of the fourth jhāna, which keeps a pleasant feeling.
      - figure "Sampayoga sheet" [ref=f20e23]:
        - blockquote [ref=f20e24]:
          - paragraph [ref=f20e25]: Pīti is the traveller’s elation at sighting water, sukha is the ease of drinking it.
      - article [ref=f20e28]:
        - paragraph [ref=f20e29]: A combination rule
        - paragraph [ref=f20e30]: Sixty-two cittas have joyful feeling and rapture arises in fifty-one of them. The eleven left out are the fourth-jhāna cittas. That gap is the sheet’s evidence that the two are not one factor named twice. Bodily pleasure (sukha) is not mental joy (somanassa), and rapture is tied to the mental feeling. The jhāna table uses sukha for the pleasant feeling that remains after rapture drops, so the English word "pleasant" covers more than one slot in the sheets.
        - paragraph [ref=f20e31]: Sampayoga sheet, on pīti and somanassa
