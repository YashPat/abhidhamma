                - cell "Determining, repeated two or three times" [ref=f41e136]
                - cell "No" [ref=f41e137]
              - row [ref=f41e138]:
                - cell "Atiparitta — very slight" [ref=f41e139]
                - cell "Bhavaṅga vibration only" [ref=f41e140]
                - cell "No" [ref=f41e141]
          - paragraph [ref=f41e142]: "The last case is called the futile course (moghavāra): the object strikes, the life-continuum trembles, and the mind never turns toward it at all. This is the mechanism behind everything you are exposed to but never notice."
          - heading "The Mind-Door Process" [level=2] [ref=f41e143]
          - paragraph [ref=f41e144]: When the object is not a present physical impingement but a memory, concept, idea, or the object of meditation, the process runs through the mind door alone. It is shorter, because there is no sense base to receive from and no receiving or investigating to do.
          - table [ref=f41e146]:
            - rowgroup [ref=f41e147]:
              - row [ref=f41e148]:
                - columnheader "#" [ref=f41e149]
                - columnheader "Moment" [ref=f41e150]
                - columnheader "Function" [ref=f41e151]
            - rowgroup [ref=f41e152]:
              - row [ref=f41e153]:
                - cell "1" [ref=f41e154]
                - cell "Bhavaṅga-calana" [ref=f41e155]
                - cell "Vibration" [ref=f41e156]
              - row [ref=f41e157]:
                - cell "2" [ref=f41e158]
                - cell "Bhavaṅgupaccheda" [ref=f41e159]
                - cell "Arrest" [ref=f41e160]
              - row [ref=f41e161]:
                - cell "3" [ref=f41e162]
                - cell "Manodvārāvajjana" [ref=f41e163]
                - cell "Mind-door adverting" [ref=f41e164]
              - row [ref=f41e165]:
                - cell "4–10" [ref=f41e166]
                - cell "Javana ×7" [ref=f41e167]
                - cell "Impulsion" [ref=f41e168]
              - row [ref=f41e169]:
                - cell "11–12" [ref=f41e170]
                - cell "Tadārammaṇa ×2" [ref=f41e171]
                - cell "Registration" [ref=f41e172]
          - paragraph [ref=f41e173]: "Here the mind-door adverting citta performs adverting and determining in a single moment, and the javanas follow immediately. Every five-door process is normally followed by consequent mind-door processes, each a process of its own. The manual's account of them, from Ledi Sayadaw, runs: a conformational process; grasping the object as a whole; recognizing the colour; grasping the entity; recognizing the entity; grasping the name; recognizing the name. What we ordinarily call \"seeing a cup\" is that chain, not the eye-door seeing."
          - heading "The Absorption Process" [level=2] [ref=f41e174]
          - paragraph [ref=f41e175]: "When the mind door is to reach jhāna, path, or a psychic attainment, the process is not seven ordinary javanas with absorption put in their place. Any of the eight sense-sphere javanas accompanied by knowledge — four wholesome, or four functional in an arahant — runs four times, or three when faculties are keen. In order they are preparation, access, conformity, and change-of-lineage, and keen faculties omit preparation. Absorption arises in the next moment. On a beginner's first occasion that absorption javana runs once. With mastery, absorption javanas continue through many moments. Path consciousness is one moment: two fruition moments follow when preparation was present, and three when it was omitted. Direct knowledge is also a single javana. The ordinary sense-sphere process still runs seven javanas. This occurs at the mind door."
          - table [ref=f41e177]:
            - rowgroup [ref=f41e178]:
              - row [ref=f41e179]:
                - columnheader "Moment" [ref=f41e180]
                - columnheader "Function" [ref=f41e181]
            - rowgroup [ref=f41e182]:
              - row [ref=f41e183]:
                - cell "Parikamma" [ref=f41e184]
                - cell "Preparation" [ref=f41e185]
              - row [ref=f41e186]:
                - cell "Upacāra" [ref=f41e187]
                - cell "Access" [ref=f41e188]
              - row [ref=f41e189]:
                - cell "Anuloma" [ref=f41e190]
                - cell "Conformity" [ref=f41e191]
              - row [ref=f41e192]:
                - cell "Gotrabhū" [ref=f41e193]
                - cell "Change of lineage" [ref=f41e194]
              - row [ref=f41e195]:
                - cell "Appanā" [ref=f41e196]
                - cell "Absorption" [ref=f41e197]
          - paragraph [ref=f41e198]: "Gotrabhū is the pivot: it is the last citta of the sense sphere, standing at the threshold of a plane it does not itself belong to. The moment after it, the mind is somewhere it has never been. In a path process it also changes object, taking Nibbāna while still being a sense-sphere citta; in a jhāna process there is no such shift, since preparation onward all take the counterpart sign. In a path process, absorption is the path citta, and it is followed immediately by two or three moments of fruition."
          - heading "The Death Process" [level=2] [ref=f41e199]
          - paragraph [ref=f41e200]: Dying is a cognitive process like any other, distinguished by a weaker javana run and by what can follow it. The javanas in the final process number five rather than seven, because the mind at death is weak.
          - paragraph [ref=f41e201]: After those five, two registration cittas may follow, and life-continuum may follow the process cittas. Death consciousness arises at the end of that process, or at the dissolution of the life-continuum. One course has the five javanas and then death, with nothing between them.
          - paragraph [ref=f41e202]: "The object presented to those five javanas is one of three things, produced by the kamma that is about to ripen into the next life: the kamma itself, re-experienced as the deed; a kamma-nimitta, a sign or instrument associated with it; or a gati-nimitta, a vision of the destination."
          - heading "1. Cuti citta — Death consciousness" [level=3] [ref=f41e203]
          - paragraph [ref=f41e204]: The last citta of a lifetime, performing the function of falling away. It is the same resultant citta that has served as bhavaṅga throughout that life, and it does nothing but end. It is not itself the cause of the next life.
          - heading "2. Paṭisandhi citta — Rebirth-linking consciousness" [level=3] [ref=f41e205]
          - paragraph [ref=f41e206]: The first citta of the next existence, arising in the very next moment after death with no gap. It takes as its object whatever the dying javanas took, which is why the last process of one life determines the first of the next. It is resultant, produced by the kamma that presented that object.
          - heading "3. Bhavaṅga — Life-continuum" [level=3] [ref=f41e207]
          - paragraph [ref=f41e208]: Immediately after rebirth-linking, the same citta begins repeating as the passive substrate of the new life. It carries the same object for the whole lifetime and surfaces whenever no process is running. This is the thread that makes a life one life, and it is the state the mind returns to at the end of every vīthi described above.
  - contentinfo [ref=f41e209]:
    - paragraph [ref=f41e211]: The four sheets are shown as written. Pronunciation is a guide to that romanization; the sheets do not record it. Each real moment is a reading aid written to match the sheet’s definition, and is not itself in the sheets. Counts and combination rules are.