        - article [ref=f41e38]:
          - heading "Citta-vīthi Reference Sheet" [level=1] [ref=f41e39]
          - heading "The Framework" [level=2] [ref=f41e40]
          - paragraph [ref=f41e41]:
            - text: "A vīthi is a cognitive process: the fixed sequence of cittas that runs whenever an object is actually cognized. The eighty-nine cittas are a taxonomy of what can occur; the vīthi is the account of"
            - emphasis [ref=f41e42]: when
            - text: and
            - emphasis [ref=f41e43]: in what order
            - text: they occur. Nothing in the mind happens at random — each citta arises in a determined position, performs one function, and gives way to the next.
          - paragraph [ref=f41e44]: Between processes the mind is not blank. It rests in bhavaṅga, the life-continuum, a passive resultant citta that repeats indefinitely and takes as its object whatever was cognized in the last moment of the previous life. A process is an interruption of bhavaṅga, and when the process ends the mind sinks back into it.
          - paragraph [ref=f41e45]: The reason this matters for practice is concentrated in one part of the sequence. Of the seventeen moments in a full sense-door process, the seven javanas are where kamma is made, for anyone short of arahantship. An arahant's javanas run in the same place and produce none. Everything before the javanas is passive reception, and everything after is aftermath.
          - heading "The Five-Door Process" [level=2] [ref=f41e46]
          - paragraph [ref=f41e47]: "The full seventeen-moment sequence, which occurs when an object of the highest intensity strikes one of the five physical senses. A material object lasts exactly seventeen mind-moments, which is why the process has this length: it is the complete cognition of an object from arising to perishing."
