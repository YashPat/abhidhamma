          - heading "1. Atīta-bhavaṅga — Past life-continuum" [level=3] [ref=f41e96]
          - paragraph [ref=f41e97]: The one moment of bhavaṅga that elapses after the object has struck the sense base but before the mind has begun to respond. It is counted because the object's seventeen-moment life has already started. Nothing is yet known.
          - heading "2. Bhavaṅga-calana — Vibration" [level=3] [ref=f41e98]
          - paragraph [ref=f41e99]: The life-continuum vibrates under the impact. This moment does not take the new object, and nothing is yet known. The object is first taken at five-door adverting. Registration is a later pair of cittas, at the end of the process.
          - heading "3. Bhavaṅgupaccheda — Arrest" [level=3] [ref=f41e100]
          - paragraph [ref=f41e101]: The final moment of bhavaṅga, in which the stream of passive continuity is cut off. After this the mind is no longer resting; a process has begun. It is the hinge between the two modes of mental life.
          - heading "4. Pañcadvārāvajjana — Five-door adverting" [level=3] [ref=f41e102]
          - paragraph [ref=f41e103]: "The mind turns toward the object that has struck a sense organ. This is a rootless functional citta, so it makes no kamma. Which of the five sense consciousnesses follows is fixed by that organ and that object: a visible form is followed by eye-consciousness, a sound by ear-consciousness, and so on."
          - heading "5. Pañca-viññāṇa — Sense consciousness" [level=3] [ref=f41e104]
          - paragraph [ref=f41e105]: "Seeing, hearing, smelling, tasting, or touching: the bare sensory contact, and the only moment in the entire process where the object is met through a physical faculty. It is a resultant citta, wholesome-resultant or unwholesome-resultant depending on whether the object is desirable, and it knows nothing beyond the raw datum. All the recognition and reaction that seem to belong to seeing happen later."
          - heading "6. Sampaṭicchana — Receiving" [level=3] [ref=f41e106]
          - paragraph [ref=f41e107]: The object is taken up and passed inward from the sense consciousness. It is resultant, matching the sense consciousness in nature. It does no work of its own beyond the handover.
          - heading "7. Santīraṇa — Investigating" [level=3] [ref=f41e108]
          - paragraph [ref=f41e109]: The object is examined — its qualities considered, though not yet judged. Still resultant, still kammically inert. This is where the desirability of the object is registered, which is why it alone among the rootless resultants can carry joy — an intensely desirable object gets the joyful variety, a merely desirable one the neutral.
          - heading "8. Votthapana — Determining" [level=3] [ref=f41e110]
          - paragraph [ref=f41e111]: The object is determined and the mind decides how to take it. This function is performed by the mind-door adverting citta, doing double duty here at the five doors. It is the last inert moment, and it is the point at which the kammic character of what follows is settled — which makes wise attention here decisive.
          - heading "9–15. Javana — Impulsion" [level=3] [ref=f41e112]
          - paragraph [ref=f41e113]: Seven identical cittas run in immediate succession in an ordinary process. For anyone short of arahantship, these are the moments in which kamma is made. An arahant's javanas are functional and produce none. A weak object can cut the run to six, and at death or fainting it runs to five. If the mind has determined the object with greed, greed-rooted cittas run; if with generosity, wholesome ones. The first javana is kammically weakest and ripens in this life, the seventh weakens again and ripens in the next, and the middle five ripen whenever conditions allow across any future life.
          - heading "16–17. Tadārammaṇa — Registration" [level=3] [ref=f41e114]
          - paragraph [ref=f41e115]: Two moments in which the object is held on to briefly after the active phase ends. They are resultant, and they occur only for objects of the highest intensity and only in the sense sphere. After them the mind falls back into bhavaṅga.
          - heading "Shorter Processes" [level=2] [ref=f41e116]
          - paragraph [ref=f41e117]: Not every object gets the full seventeen. The process truncates according to how strongly the object presents itself, and how many bhavaṅgas elapse before the mind can advert to it. Four intensities are distinguished.
          - table [ref=f41e119]:
            - rowgroup [ref=f41e120]:
              - row [ref=f41e121]:
                - columnheader "Object intensity" [ref=f41e122]
                - columnheader "Process runs to" [ref=f41e123]
