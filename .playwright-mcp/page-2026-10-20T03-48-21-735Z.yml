          - paragraph [ref=f17e46]: In a loud café the mind swings onto one voice and the rest drops into the background.
        - paragraph [ref=f17e47]: That steering onto an object is attention. It selects what contact then meets. It has not labeled the voice, and it is not the mindfulness that only beautiful moments have.
