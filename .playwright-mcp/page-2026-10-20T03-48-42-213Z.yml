        - heading "Consonants and stress" [level=3] [ref=f18e57]
        - list [ref=f18e58]:
          - listitem [ref=f18e59]: An apostrophe after a consonant means a puff of air. ph, th, and kh are p, t, and k plus that puff, not f and not the th in think.
          - listitem [ref=f18e60]: bh, dh, and gh are b, d, and g plus a puff. bh is not v.
          - listitem [ref=f18e61]: c is the ch in church. ch in the romanization adds the puff.
          - listitem [ref=f18e62]: ñ is the ny in canyon. ṭ, ḍ, and ṇ are t, d, and n with the tongue curled back.
          - listitem [ref=f18e63]: A consonant written twice is held for a beat, as in phassa or kamma.
          - listitem [ref=f18e64]: Stress falls on the last heavy syllable that is not the final one. A syllable is heavy when its vowel is long (ā, ī, ū, e, o) or when it ends in a consonant.
