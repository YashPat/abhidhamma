        - paragraph [ref=f21e48]: "The meeting of a sense faculty, its object, and the consciousness that knows it. Contact is not physical touching but the mental \"coming together\" that makes experience possible at all. Everything else in the mind rests on it: without contact there is nothing to feel, perceive, or respond to."
