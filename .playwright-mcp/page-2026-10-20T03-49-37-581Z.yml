        - blockquote [ref=f21e37]:
          - paragraph [ref=f21e38]: The kettle clicks off. Before the word "tea," and before any wish to get up, the sound meets hearing.
        - paragraph [ref=f21e39]: That meeting of ear, sound, and the consciousness that knows it is contact. It is not the physical click. The tone of the click is feeling, a different factor in the same moment.
        - paragraph [ref=f21e40]: The cetasika sheet defines the factor. This scene is a reading aid written to match that definition. It is not in the sheets.
