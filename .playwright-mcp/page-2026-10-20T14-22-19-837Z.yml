        - heading "A moment that shows it" [level=2] [ref=f42e45]
        - blockquote [ref=f42e46]:
          - paragraph [ref=f42e47]: The contract pays well. It is for a weapons broker. You turn it down.
        - paragraph [ref=f42e48]: Right livelihood is that abstention, in the moment you turn the gain down. The manuals name poisons, intoxicants, weapons, slaves, and animals for slaughter. The discourse names weapons, living beings, meat, intoxicants, and poison. A job you feel proud of is not, by itself, this factor.
        - paragraph [ref=f42e49]: The cetasika sheet defines the factor. This scene is a reading aid written to match that definition. It is not in the sheets.
      - generic [ref=f42e50]:
        - heading "Where it arises" [level=2] [ref=f42e51]
        - paragraph [ref=f42e52]: "16 cittas: the 8 great wholesome and the 8 supramundane. In an ordinary wholesome moment, at most one abstinence, and often none. In the supramundane, all three are present and fixed."
        - paragraph [ref=f42e53]: From the sampayoga sheet, on the eighty-nine-citta scheme unless the line says otherwise.
      - generic [ref=f42e54]:
        - heading "From the cetasika sheet" [level=2] [ref=f42e55]
        - paragraph [ref=f42e57]: Abstention from earning a living by dealing in poisons, intoxicants, weapons, slaves, or animals for slaughter. That is the list in the Abhidhamma manuals. The discourse they narrow names weapons, living beings, meat, intoxicants, and poison. It arises as a mental factor in the moment of turning such gain down. Completing the virtue section of the path, it extends ethics into how one is sustained.
